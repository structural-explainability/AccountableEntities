# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and verification executable.

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "AccountableEntities"
version = "0.2.0"
license = "MIT"

keywords = [
  "structural-explainability",
  "accountable-entities",
  "entity-kinds",
  "identity-regimes",
  "formal-specification",
  "formal-verification",
  "theorem-proving",
  "lean4",
]

# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["AccountableEntities"]

# ============================================================
# DEPENDENCIES
# ============================================================
# Lake dependency names must match the required package names,
# not necessarily the GitHub repository names or Lean import roots.

[[require]]
name = "SETheoryIdentityRegimes"
git = "https://github.com/structural-explainability/se-theory-identity-regimes"
rev = "main"

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# Downstream Lean projects import this library root.
# Lake discovers modules under the matching source directory.

[[lean_lib]]
name = "AccountableEntities"

# ============================================================
# EXECUTABLES
# ============================================================
# Export executables generate machine-readable contract artifacts.

[[lean_exe]]
name = "verify"
root = "Main"