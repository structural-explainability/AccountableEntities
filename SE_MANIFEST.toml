# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "AccountableEntities"
org  = "structural-explainability"
class = "theory"
kind = "formalization"
status = "active"
since = "2025"
summary = "Lean formalization of the six Accountable Entity kinds and their conformance mapping onto the canonical identity-regime profiles owned by se-theory-identity-regimes."

# === Layer Position ===

[layer]
space = "structural-explainability"
role  = "theory"

# === Dependency Declarations ===

[depends]
required = [
  { repository = "spec-se", kind = "semantic", version = "v1" },
  { repository = "spec-ae", kind = "semantic", version = "v1" },
  { repository = "se-theory-identity-regimes", kind = "semantic", version = "v1", reason = "Canonical owner of regime families and profile kinds; do not use the superseded PascalCase IdentityRegimes repo." },
]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
  "AccountableEntities/",
  "ANNOTATIONS.md",
  "CITATION.cff",
  "README.md",
  "SE_MANIFEST.toml"
]

# === Scope ===

[scope]
includes = [
"the six Accountable Entity kinds as Lean types",
"profile-conformance relations from accountable entity kinds to canonical identity-regime profiles",
"proof scaffolding for accountable-entity/profile conformance",
]
excludes = [
  "definition of regime families or profile kinds (owned by se-theory-identity-regimes)",
  "domain-specific entity semantics",
  "operational code generation",
  "epistemic, causal, or normative conclusions",
]

[citation]
cff = "CITATION.cff"
preferred = "repo"

[traceability]
identifier_map = "AccountableEntities/Spec/IdentifierMap.lean"
