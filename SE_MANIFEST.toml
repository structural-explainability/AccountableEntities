# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repo]
name = "AccountableEntities"
org  = "structural-explainability"
class = "theory"
kind = "formalization"
status = "reference"
since = "2025"
summary = "Lean formalization of AE identity regimes and conformance predicates."

# === Layer Position ===

[layer]
space = "structural-explainability"
role  = "theory"

# === Dependency Declarations ===

[depends]
required = [
  { repo = "spec-se", kind = "semantic", version = "v1" },
  { repo = "spec-ae", kind = "semantic", version = "v1" },
]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
  "ANNOTATIONS.md",
  "CITATION.cff",
  "README.md",
  "SE_MANIFEST.toml"
]

# === Scope ===

[scope]
includes = [
  "types and predicates for AE kinds and regimes",
  "proof scaffolding for AE conformance",
]
excludes = [
  "domain semantics",
  "implementation code generation",
  "epistemic, causal, or normative conclusions",
]

[citation]
cff = "CITATION.cff"
preferred = "repo"

[traceability]
identifier_map = "AccountableEntities/Spec/IdentifierMap.lean"
